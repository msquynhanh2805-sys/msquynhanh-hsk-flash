<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK 1 Vocabulary & Quiz Master</title>
  <link rel="stylesheet" href="style.css">
  <!-- Thư viện SheetJS đọc file Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Thư viện Canvas Confetti bắn pháo hoa -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🇨🇳 HSK 1 Master App</h1>
      <button id="theme-toggle" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </header>

    <!-- SECTION 1: FLASHCARD -->
    <section class="flashcard-section">
      <div class="card-counter">
        <span id="current-index">1</span> / <span id="total-cards">143</span>
      </div>

      <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
          <!-- Mặt trước -->
          <div class="card-face card-front">
            <h2 id="card-hanzi">...</h2>
            <p id="card-pinyin">...</p>
            <span class="hint">Click để lật thẻ 🔄</span>
          </div>
          <!-- Mặt sau -->
          <div class="card-face card-back">
            <h3 id="card-meaning">...</h3>
            <hr>
            <p class="example-title">Ví dụ:</p>
            <p id="card-example-cn" class="example-cn">...</p>
            <p id="card-example-vn" class="example-vn">...</p>
          </div>
        </div>
      </div>

      <div class="controls">
        <button onclick="prevCard()">⬅️ Từ trước</button>
        <button onclick="nextCard()">Từ tiếp ➡️</button>
      </div>
    </section>

    <hr class="divider">

    <!-- SECTION 2: BÀI TẬP ÔN TẬP (QUIZ PHÁO HOA) -->
    <section class="quiz-section">
      <div class="quiz-box">
        <div class="quiz-header">
          <span class="badge">🎆 Bài Tập Ôn Tập HSK 1</span>
          <p class="quiz-prompt">Chọn Hán tự đúng cho nghĩa tiếng Việt sau:</p>
          <h2 id="quiz-meaning">Đang tải dữ liệu...</h2>
        </div>

        <div id="quiz-options" class="options-grid">
          <!-- Các lựa chọn đáp án được sinh tự động bằng JS -->
        </div>

        <div class="quiz-footer">
          <p id="quiz-feedback" class="feedback-msg"></p>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
