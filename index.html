<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK 1 Luyện Tập Phản Xạ</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🇨🇳 HSK 1 App Luyện Tập</h1>
      <button id="theme-toggle" class="btn-theme" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </header>

    <!-- DẠNG 1: TRẮC NGHIỆM CHỌN HÁN TỰ / PINYIN -->
    <section class="quiz-section">
      <div class="quiz-card">
        <div class="badge-wrapper">
          <span class="badge green">❇️ Bài Tập Ôn Tập HSK 1</span>
        </div>
        <p class="quiz-prompt">Chọn Hán tự đúng với nghĩa tiếng Việt dưới đây:</p>
        <h2 id="mc-meaning" class="quiz-meaning">"..."</h2>

        <div id="mc-options" class="options-list"></div>
        <p id="mc-feedback" class="feedback-msg"></p>
      </div>
    </section>

    <hr class="section-divider">

    <!-- DẠNG 2: SẮP XẾP CÂU PINYIN (60s + Nút Pause + Lưu tiến độ) -->
    <section class="quiz-section">
      <div class="quiz-card">
        <div class="badge-wrapper">
          <span class="badge blue">⚡ Sắp Xếp Câu Pinyin</span>
        </div>

        <!-- Tiến độ & Thời gian -->
        <div class="quiz-meta">
          <span class="progress-text" id="scramble-progress">Tiến độ: 0/0</span>
          <span class="timer-text" id="timer-text">⏱️ 60s</span>
        </div>

        <div class="timer-container">
          <div id="timer-bar" class="timer-bar"></div>
        </div>

        <p class="quiz-prompt">Sắp xếp các từ Pinyin thành câu đúng (Click từ đã chọn để hủy):</p>
        <h2 id="scramble-meaning" class="quiz-meaning">"..."</h2>

        <!-- Ô xếp câu của người dùng -->
        <div class="sentence-builder-box" id="user-sentence">
          <span class="placeholder-text">Click chọn các từ pinyin bên dưới...</span>
        </div>

        <!-- Ô chứa các từ Pinyin xáo trộn -->
        <div class="word-pool" id="word-pool"></div>

        <div class="quiz-footer">
          <button id="btn-pause" class="btn-control" onclick="togglePause()">⏸️ Tạm dừng</button>
          <button class="btn-control" onclick="resetCurrentSentence()">🔄 Làm lại câu này</button>
          <button class="btn-control primary" onclick="skipToNextSentence()">⏭️ Câu tiếp theo</button>
        </div>

        <p id="scramble-feedback" class="feedback-msg"></p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
