<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK 1 Luyện Tập</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🇨🇳 HSK 1 App Luyện Tập</h1>
      <button id="theme-toggle" class="btn-theme" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </header>

    <!-- THANH CHUYỂN TAB -->
    <nav class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('tab-mc', this)">
        ❇️ Ôn Từ Vựng
      </button>
      <button class="tab-btn" onclick="switchTab('tab-builder', this)">
        🧩 Sắp Xếp Câu
      </button>
    </nav>

    <!-- TAB 1: TRẮC NGHIỆM CHỌN HÁN TỰ / PINYIN -->
    <section id="tab-mc" class="tab-content active">
      <div class="quiz-card">
        <div class="quiz-meta">
          <span class="progress-text" id="mc-progress">Tiến độ từ: 0/0</span>
          <button class="btn-control" onclick="skipMcQuestion()" style="padding: 2px 8px; font-size: 11px;">Bỏ qua ⏭️</button>
        </div>

        <p class="quiz-prompt">Chọn Hán tự đúng với nghĩa tiếng Việt dưới đây:</p>
        <h2 id="mc-meaning" class="quiz-meaning">"..."</h2>

        <div id="mc-options" class="options-list"></div>
        <p id="mc-feedback" class="feedback-msg"></p>
      </div>
    </section>

    <!-- TAB 2: SẮP XẾP TỪ THÀNH CÂU -->
    <section id="tab-builder" class="tab-content">
      <div class="quiz-card">
        <div class="quiz-meta">
          <span class="progress-text" id="builder-progress">Tiến độ câu: 0/0</span>
          <button class="btn-control" onclick="speakSample()" style="padding: 4px 10px; font-size: 12px; color: #0969da;">🔊 Nghe câu mẫu</button>
        </div>

        <p class="quiz-prompt">Dịch nghĩa sau sang tiếng Trung bằng cách ghép từ:</p>
        <h2 id="builder-meaning" class="quiz-meaning">"..."</h2>

        <!-- Khung chứa các từ đã chọn -->
        <div class="sentence-builder-box" id="selected-words-box">
          <p class="placeholder-text" id="builder-placeholder">Click vào các từ bên dưới để ghép câu...</p>
        </div>

        <!-- Khung chứa các từ bị xáo trộn để chọn -->
        <div id="word-pool" class="word-pool"></div>

        <div class="quiz-footer" style="margin-top: 15px;">
          <button class="btn-control primary" onclick="checkBuilderAnswer()" style="font-size: 15px; padding: 10px 20px;">
            ✅ Kiểm Tra Đáp Án
          </button>
          <button class="btn-control" onclick="resetBuilderSelection()">🔄 Chọn Lại</button>
          <button class="btn-control" onclick="skipBuilderSentence()">⏭️ Bỏ Qua</button>
        </div>

        <p id="builder-feedback" class="feedback-msg"></p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
