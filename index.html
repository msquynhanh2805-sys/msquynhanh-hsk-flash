<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK 1 Luyện Tập Phản Xạ</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🇨🇳 HSK 1 App Luyện Tập</h1>
      <button id="theme-toggle" class="btn-theme" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </header>

    <!-- DẠNG 1: TRẮC NGHIỆM CHỌN HÁN TỰ / PINYIN -->
    <section class="quiz-section">
      <div class="quiz-card">
        <div class="badge-wrapper">
          <span class="badge green">❇️ Bài Tập Ôn Tập HSK 1</span>
        </div>
        <p class="quiz-prompt">Chọn Hán tự đúng với nghĩa tiếng Việt dưới đây:</p>
        <h2 id="mc-meaning" class="quiz-meaning">"..."</h2>

        <div id="mc-options" class="options-list"></div>
        <p id="mc-feedback" class="feedback-msg"></p>
      </div>
    </section>

    <hr class="section-divider">

    <!-- DẠNG 2: SẮP XẾP CÂU PINYIN + ĐẾM NGƯỢC PHẢN XẠ -->
    <section class="quiz-section">
      <div class="quiz-card">
        <div class="badge-wrapper">
          <span class="badge blue">⚡ Sắp Xếp Câu Phản Xạ (10s)</span>
        </div>

        <!-- Thanh thời gian đếm ngược -->
        <div class="timer-container">
          <div id="timer-bar" class="timer-bar"></div>
        </div>

        <p class="quiz-prompt">Sắp xếp các từ Pinyin thành câu trước khi hết giờ:</p>
        <h2 id="scramble-meaning" class="quiz-meaning">"..."</h2>

        <div class="sentence-builder-box" id="user-sentence">
          <span class="placeholder-text">Click chọn các từ pinyin bên dưới...</span>
        </div>

        <div class="word-pool" id="word-pool"></div>

        <div class="quiz-footer">
          <button class="btn-reset" onclick="initSentenceScrambleQuiz()">⏭️ Câu tiếp theo</button>
          <p id="scramble-feedback" class="feedback-msg"></p>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
