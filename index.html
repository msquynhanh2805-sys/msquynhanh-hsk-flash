<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK1 Flashcards</title>
  <link rel="stylesheet" href="style.css">
  <!-- Thư viện đọc Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>HSK1 Flashcards</h1>
      <nav class="tab-nav">
        <button id="btn-vocab" class="tab-btn active" onclick="switchTab('vocab')">📖 Từ Vựng</button>
        <button id="btn-sentence" class="tab-btn" onclick="switchTab('sentence')">🧩 Ghép Cấu</button>
      </nav>
    </header>

    <!-- TAB 1: TỪ VỰNG -->
    <main id="vocab-tab" class="tab-content active">
      <!-- Màn hình Setup -->
      <div id="vocab-setup" class="card-box">
        <h2>Phiên Học Từ Vựng</h2>
        <div class="stats-panel">
          <p>📚 Tổng số từ: <span id="total-words">0</span></p>
          <p>✅ Đã học: <span id="learned-words">0</span></p>
          <p>⏳ Còn lại: <span id="remaining-words">0</span></p>
        </div>

        <div class="form-group">
          <label for="vocab-session-count">Số từ muốn học phiên này:</label>
          <input type="number" id="vocab-session-count" value="10" min="1" max="150">
        </div>

        <button class="primary-btn" onclick="startVocabSession()">🔥 Bắt đầu học</button>
      </div>

      <!-- Màn hình Quiz -->
      <div id="vocab-quiz" class="card-box" style="display: none;">
        <div class="progress-bar-container">
          <div id="vocab-progress-bar" class="progress-bar"></div>
        </div>
        <div id="vocab-progress-text" class="progress-text">0/0</div>

        <div class="flashcard">
          <div id="vocab-hanzi" class="hanzi-text">你好</div>
          <div id="vocab-pinyin" class="pinyin-text">nǐ hǎo</div>
        </div>

        <div id="vocab-options" class="options-grid">
          <!-- Các nút đáp án sẽ sinh tự động ở đây -->
        </div>
      </div>
    </main>

    <!-- TAB 2: GHÉP CÂU -->
    <main id="sentence-tab" class="tab-content" style="display: none;">
      <div id="sentence-quiz" class="card-box">
        <h2>Luyện Ghép Câu HSK1</h2>
        <div class="progress-bar-container">
          <div id="sentence-progress-bar" class="progress-bar"></div>
        </div>
        <div id="sentence-progress-text" class="progress-text">0/0</div>

        <div class="sentence-prompt">
          <p class="label">Nghĩa của câu:</p>
          <h3 id="sentence-meaning">Xin chào bạn!</h3>
        </div>

        <!-- Khung chứa từ do người dùng xếp -->
        <div id="user-sentence-zone" class="drop-zone">
          <!-- Từ đã chọn sẽ xuất hiện ở đây -->
        </div>

        <!-- Khung chứa các từ gợi ý -->
        <div id="sentence-word-pool" class="word-pool">
          <!-- Các từ chip sẽ sinh tự động ở đây -->
        </div>

        <button class="primary-btn" onclick="checkSentenceAnswer()">Check / Kiểm tra</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
