<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK 1 Pro Learning App</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🇨🇳 HSK 1 Master App</h1>
      <button id="theme-toggle" class="btn-theme" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </header>

    <!-- THANH NÚT CHUYỂN TAB -->
    <nav class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('tab-mc', this)">
        📚 Ôn Từ Vựng
      </button>
      <button class="tab-btn" onclick="switchTab('tab-builder', this)">
        🧩 Ghép Cấu Trúc Câu
      </button>
    </nav>

    <!-- ==================== TAB 1: ÔN TỪ VỰNG ==================== -->
    <section id="tab-mc" class="tab-content active">
      <div class="quiz-card">
        <div class="quiz-header">
          <span class="badge" id="mc-mode-badge">Chế độ: Toàn bộ</span>
          <span class="progress-info" id="mc-progress-text">0/0</span>
        </div>

        <!-- Thanh tiến trình -->
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="mc-progress-bar"></div>
        </div>

        <p class="quiz-prompt">Chọn Hán tự/Pinyin đúng với nghĩa:</p>
        <h2 id="mc-meaning" class="quiz-meaning">"..."</h2>

        <div id="mc-options" class="options-list"></div>

        <p id="mc-feedback" class="feedback-msg"></p>

        <div class="quiz-footer">
          <button class="btn-control warning" id="mc-review-btn" onclick="toggleMcReviewMode()">
            ⚠️ Ôn câu sai (<span id="mc-wrong-count">0</span>)
          </button>
          <button class="btn-control" onclick="skipMcQuestion()">Bỏ qua ⏭️</button>
        </div>
      </div>
    </section>

    <!-- ==================== TAB 2: SẮP XẾP CÂU ==================== -->
    <section id="tab-builder" class="tab-content">
      <div class="quiz-card">
        <div class="quiz-header">
          <span class="badge" id="builder-mode-badge">Chế độ: Toàn bộ</span>
          <span class="progress-info" id="builder-progress-text">0/0</span>
        </div>

        <!-- Thanh tiến trình -->
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="builder-progress-bar"></div>
        </div>

        <p class="quiz-prompt">Sắp xếp các từ thành câu chuẩn nghĩa:</p>
        <h2 id="builder-meaning" class="quiz-meaning">"..."</h2>

        <!-- Khung chứa từ m chọn -->
        <div class="sentence-builder-box" id="selected-words-box">
          <p class="placeholder-text">Click vào từng từ bên dưới để ghép câu...</p>
        </div>

        <!-- Khung từ xáo trộn -->
        <div id="word-pool" class="word-pool"></div>

        <p id="builder-feedback" class="feedback-msg"></p>

        <div class="quiz-footer main-actions">
          <button class="btn-control primary" onclick="checkBuilderAnswer()">
            ✅ Kiểm Tra
          </button>
          <button class="btn-control" onclick="resetBuilderSelection()">🔄 Chọn Lại</button>
          <button class="btn-control" onclick="skipBuilderSentence()">⏭️ Bỏ Qua</button>
        </div>

        <div class="quiz-footer sub-actions">
          <button class="btn-control warning" id="builder-review-btn" onclick="toggleBuilderReviewMode()">
            ⚠️ Ôn câu sai (<span id="builder-wrong-count">0</span>)
          </button>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
