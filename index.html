<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK 1 Luyện Phản Xạ Nói</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🇨🇳 HSK 1 App Luyện Tập</h1>
      <button id="theme-toggle" class="btn-theme" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </header>

    <!-- DẠNG 1: TRẮC NGHIỆM CHỌN HÁN TỰ / PINYIN -->
    <section class="quiz-section">
      <div class="quiz-card">
        <div class="badge-wrapper">
          <span class="badge green">❇️ Dạng 1: Ôn Tập Từ Vựng</span>
        </div>
        
        <div class="quiz-meta">
          <span class="progress-text" id="mc-progress">Tiến độ từ: 0/0</span>
          <button class="btn-control" onclick="skipMcQuestion()" style="padding: 2px 8px; font-size: 11px;">Bỏ qua ⏭️</button>
        </div>

        <p class="quiz-prompt">Chọn Hán tự đúng với nghĩa tiếng Việt dưới đây:</p>
        <h2 id="mc-meaning" class="quiz-meaning">"..."</h2>

        <div id="mc-options" class="options-list"></div>
        <p id="mc-feedback" class="feedback-msg"></p>
      </div>
    </section>

    <hr class="section-divider">

    <!-- DẠNG 2: LUYỆN NÓI CÂU BẰNG MICRO -->
    <section class="quiz-section">
      <div class="quiz-card">
        <div class="badge-wrapper">
          <span class="badge blue">🎙️ Dạng 2: Luyện Phản Xạ Nói Câu</span>
        </div>

        <div class="quiz-meta">
          <span class="progress-text" id="speaking-progress">Tiến độ câu: 0/0</span>
          <button class="btn-control" onclick="speakSample()" style="padding: 4px 10px; font-size: 12px; color: #0969da;">🔊 Nghe câu mẫu</button>
        </div>

        <p class="quiz-prompt">Đọc câu tiếng Trung tương ứng với nghĩa dưới đây:</p>
        <h2 id="speaking-meaning" class="quiz-meaning">"..."</h2>

        <!-- Khung hiển thị gợi ý Pinyin & Hán tự -->
        <div class="sentence-builder-box" id="speaking-box">
          <p style="color: #57606a; font-size: 13px; margin-bottom: 4px;">Gợi ý Pinyin:</p>
          <p id="speaking-pinyin-hint" style="color: #0969da; font-weight: bold; font-size: 20px;">...</p>
        </div>

        <div class="quiz-footer" style="margin-top: 15px;">
          <button class="btn-control primary" onclick="startListening()" style="font-size: 16px; padding: 12px 24px; width: 100%; max-width: 280px;">
            🎙️ Bấm để nói
          </button>
        </div>

        <div class="quiz-footer" style="margin-top: 10px;">
          <button class="btn-control" onclick="skipSpeakingSentence()">⏭️ Bỏ qua câu này</button>
        </div>

        <p id="speaking-feedback" class="feedback-msg"></p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
