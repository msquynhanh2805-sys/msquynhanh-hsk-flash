<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK Flashcard Learner</title>
    <!-- Font Inter & Noto Sans SC cho tiếng Trung -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Style CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- SheetJS (XLSX Engine) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header & Top Bar -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>HSK Flashcard</span>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn" title="Đổi chế độ sáng/tối">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Dashboard Statistics -->
        <section class="stats-dashboard">
            <div class="stat-card">
                <div class="stat-icon total"><i class="fa-solid fa-layer-group"></i></div>
                <div class="stat-info">
                    <span class="stat-value" id="stat-total">0</span>
                    <span class="stat-label">Tổng số từ</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon remembered"><i class="fa-solid fa-circle-check"></i></div>
                <div class="stat-info">
                    <span class="stat-value" id="stat-remembered">0</span>
                    <span class="stat-label">Đã nhớ</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon forgot"><i class="fa-solid fa-circle-xmark"></i></div>
                <div class="stat-info">
                    <span class="stat-value" id="stat-forgot">0</span>
                    <span class="stat-label">Chưa nhớ</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon progress"><i class="fa-solid fa-chart-line"></i></div>
                <div class="stat-info">
                    <span class="stat-value" id="stat-percentage">0%</span>
                    <span class="stat-label">Hoàn thành</span>
                </div>
            </div>
        </section>

        <!-- Controls Bar: Filter, Search & Actions -->
        <section class="controls-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Tìm kiếm Hanzi, Pinyin, Nghĩa...">
            </div>
            <div class="filter-group">
                <select id="filter-select" class="custom-select">
                    <option value="all">Tất cả từ</option>
                    <option value="forgot">Chưa nhớ</option>
                    <option value="remembered">Đã nhớ</option>
                    <option value="favorite">Từ khó (Yêu thích ⭐)</option>
                </select>
                <button id="btn-shuffle" class="secondary-btn" title="Xáo trộn danh sách">
                    <i class="fa-solid fa-shuffle"></i> Học ngẫu nhiên
                </button>
            </div>
        </section>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="learning-progress"></div>
        </div>

        <!-- Main Flashcard Display Area -->
        <main class="flashcard-wrapper">
            <div class="card-counter">
                <span id="current-index">0</span> / <span id="total-filtered-cards">0</span>
            </div>

            <!-- 3D Card Element -->
            <div class="flashcard" id="flashcard">
                <!-- Front Side -->
                <div class="card-face card-front">
                    <button class="favorite-btn" id="fav-btn" title="Đánh dấu từ khó">
                        <i class="fa-regular fa-star"></i>
                    </button>
                    <div class="hanzi-display" id="card-hanzi">--</div>
                    <div class="flip-hint"><i class="fa-solid fa-rotate"></i> Chạm hoặc nhấn Space để lật</div>
                </div>

                <!-- Back Side -->
                <div class="card-face card-back">
                    <div class="card-back-content">
                        <div class="pinyin-display" id="card-pinyin">--</div>
                        <div class="meaning-display" id="card-meaning">--</div>
                        <hr class="divider">
                        <div class="example-box">
                            <p class="example-pinyin" id="card-example-pinyin">--</p>
                            <p class="example-vn" id="card-example-vn">--</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card Flip & Navigation Buttons -->
            <div class="card-controls">
                <button id="btn-prev" class="nav-btn" title="Từ trước"><i class="fa-solid fa-arrow-left"></i></button>
                <button id="btn-forgot" class="action-btn btn-forgot"><i class="fa-solid fa-xmark"></i> Chưa nhớ</button>
                <button id="btn-flip" class="action-btn btn-flip"><i class="fa-solid fa-rotate"></i> Lật thẻ</button>
                <button id="btn-remembered" class="action-btn btn-remembered"><i class="fa-solid fa-check"></i> Đã nhớ</button>
                <button id="btn-next" class="nav-btn" title="Từ sau"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </main>
    </div>

    <!-- Modal Congratulation -->
    <div class="modal-overlay" id="modal-congrats">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2>Chúc mừng bạn!</h2>
            <p>Bạn đã hoàn thành tất cả các từ vựng trong bộ lọc này.</p>
            <button id="btn-restart" class="primary-btn">Học lại từ đầu</button>
        </div>
    </div>

    <!-- Script App -->
    <script src="script.js"></script>
</body>
</html>
